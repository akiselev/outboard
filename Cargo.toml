[workspace]
resolver = "2"
members = [
  "crates/outboard-core",
  "crates/outboard-protocol",
  "crates/outboard",
  "crates/outboard-clap",
  "crates/outboard-clap-derive",
  "crates/outboard-tokio",
  "crates/outboard-testing",
  "examples/demo-api",
  "examples/demo-engine-echo",
  "examples/demo-host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Outboard contributors"]

[workspace.dependencies]
outboard-core = { path = "crates/outboard-core", version = "0.1.0" }
outboard-protocol = { path = "crates/outboard-protocol", version = "0.1.0" }
outboard = { path = "crates/outboard", version = "0.1.0" }
outboard-clap = { path = "crates/outboard-clap", version = "0.1.0" }
outboard-clap-derive = { path = "crates/outboard-clap-derive", version = "0.1.0" }
outboard-tokio = { path = "crates/outboard-tokio", version = "0.1.0" }
outboard-testing = { path = "crates/outboard-testing", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
schemars = { version = "1", features = ["derive", "semver1"] }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
tokio = { version = "1", features = ["process", "io-util", "io-std", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
